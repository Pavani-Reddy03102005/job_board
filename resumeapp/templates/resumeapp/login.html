{% extends 'resumeapp/base.html' %}

{% block content %}

<h1>Login</h1>

{% if messages %}

    {% for message in messages %}

        <p>{{ message }}</p>

    {% endfor %}

{% endif %}
<div class="form-container">

    <h1>Login</h1>
<form method="POST">

    {% csrf_token %}

    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <br><br>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <br><br>

    <button type="submit">

        Login

    </button>

</form>
</div>
{% endblock %}
