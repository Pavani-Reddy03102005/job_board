{% extends 'resumeapp/base.html' %}

{% block content %}

<div class="form-container">

    <h1>Upload Resume</h1>

    <form method="POST"
          enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Upload Resume
        </button>

    </form>

</div>

{% endblock %}
